:root{--bg:#fff8ec;--ink:#24324f;--sub:#6b7690;--card:#fff;--line:#f0e2c8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
header{padding:18px 16px 14px;color:#fff;background:var(--c)}

main{padding:4px 16px 24px}
section{margin-top:18px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sh h2{margin:0;font-size:17px}

.all{border:0;background:var(--c);color:#fff;font-size:14px;padding:7px 12px;border-radius:99px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.b{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:6px 2px 7px;color:var(--ink);font-family:inherit;
   display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.b .p{font-size:14px;color:var(--sub);font-family:"Andika","Segoe UI",Arial,sans-serif;min-height:17px}

.b .w{font-size:13px;color:var(--sub)}
.b:active{transform:translateY(2px);box-shadow:none}
.b.on{border-color:var(--c);background:var(--c);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.b.on .p,.b.on .c,.b.on .w{color:#fff}
.bk{padding:14px 16px 0;font-weight:700;color:var(--sub);font-size:14px}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:8px 16px 8px}
nav.list{grid-template-columns:1fr}
nav a{text-align:center;text-decoration:none;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 4px;font-size:14px}
nav a.me{background:var(--c);color:#fff;border-color:var(--c)}
footer{text-align:center;color:var(--sub);font-size:12px;padding:20px 16px 24px}
.wrap{max-width:560px;margin:0 auto}
</style></head>
<body style="--c:#e0a020"><header><div class="wrap"><small>🐼 熊猫宝宝 · 一年级华文先修本 上册 1A</small><h1>第 4 单元 · 生活王国</h1></div></header>

const A=new Audio();let q=[];
function mark(b){document.querySelectorAll('.b.on').forEach(x=>x.classList.remove('on'));if(b)b.classList.add('on')}
function go(b){mark(b);A.src='../../audio/zi/'+b.dataset.f+'.mp3';A.play().catch(()=>{})}
A.onended=()=>{if(q.length){setTimeout(()=>go(q.shift()),600)}else mark(null)};
document.querySelectorAll('.b').forEach(b=>b.onclick=()=>{q=[];go(b)});
document.querySelectorAll('.all').forEach(x=>x.onclick=()=>{const bs=[...x.closest('section').querySelectorAll('.b')];q=bs.slice(1);go(bs[0])});
</script></body></html>
